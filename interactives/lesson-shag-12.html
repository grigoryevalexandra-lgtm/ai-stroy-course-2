еряйте отчёт и слайды с первичными материалами, а не с памятью."}}],"reference":{"title":"Что сверить с примером решения","lead":"Карточка готова, если содержание проверяемо по материалам урока и финальная ответственность явно оставлена человеку.","items":["Заголовок слайда сообщает вывод, а не только тему.","Тезис связан с документом 21 или документом 08.","Цифры и даты вынесены в отдельное поле и сверены с источником.","Перед показом отчёта или слайдов выполнена ручная вычитка."]},"comparison_confirmations":["Я сверил(а) тезис с выбранным исходным документом.","Я отдельно проверил(а) все указанные цифры и даты.","Я перечитал(а) карточку перед показом руководителю."],"success_message":"Карточка слайда заполнена: вывод связан с источником, цифры и даты отделены, ручная проверка подтверждена. Можно переходить к следующему слайду или к защите отчёта.","external_failure":{"available":true,"label":"Не получилось выполнить задание в используемом сервисе","instruction":"Откройте в уроке документ 21 или документ 08, вручную составьте карточку по этим пяти полям и сверьте её по пунктам примера решения; чат-бот для завершения не нужен."},"design_rationale":"Интерактив проверяет структуру результата, а не качество свободного текста: обязательные поля фиксируют вывод, тезис, источник, отдельные цифры/даты и ручную вычитку. Допустимые документы и требования взяты непосредственно из разделов source, structure, slides и redlines урока; локальные проверки не зависят от внешнего сервиса и не оценивают свободный текст по случайным словам."},"prompts":[]}</script><script>
const payload=JSON.parse(document.getElementById('activity-data').textContent),r=payload.record,p=payload.prototype,prompts=payload.prompts,$=id=>document.getElementById(id);let attempts=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function norm(v){return String(v??'').toLowerCase().replaceAll('ё','е').replace(/\s+/g,' ').trim()}function value(f){if(f.type==='radio')return document.querySelector('input[name="'+CSS.escape(f.id)+'"]:checked')?.value||'';if(f.type==='checkbox')return $(f.id).checked;return $(f.id).value}
function valid(f){const v=value(f),rule=f.validation,mode=rule.mode;if(mode==='required')return f.type==='checkbox'?v:Boolean(norm(v));if(mode==='min_length')return norm(v).length>=Number(rule.min||1);if(mode==='equals')return norm(v)===norm(rule.value);if(mode==='one_of')return (rule.values||[]).some(x=>norm(v)===norm(x));if(mode==='contains_any')return (rule.values||[]).some(x=>norm(v).includes(norm(x)));if(mode==='contains_all')return (rule.values||[]).every(x=>norm(v).includes(norm(x)));if(mode==='checked')return v===true;if(mode==='number_range'){const n=Number(v);return Number.isFinite(n)&&n>=Number(rule.min)&&n<=Number(rule.max)}return false}
    function reportHeight(){parent.postMessage({type:'course-interactive-height',id:r.id,height:document.documentElement.scrollHeight},'*')}function unlock(){$('unlock').hidden=false;parent.postMessage({type:'course-interactive-complete',id:r.id},'*');$('unlock').scrollIntoView({behavior:'smooth',block:'start'});reportHeight()}
    function showReference(reason){$('reference').hidden=false;if(reason){$('feedback').className='feedback bad';$('feedback').innerHTML='<strong>'+esc(reason)+'</strong>'}$('reference').scrollIntoView({behavior:'smooth',block:'start'});reportHeight()}
    $('activity').onsubmit=e=>{e.preventDefault();attempts++;const failed=p.fields.filter(f=>!valid(f));if(!failed.length){$('feedback').className='feedback ok';$('feedback').innerHTML='<strong>Всё верно.</strong><p>Все обязательные пункты отмечены.</p>';$('safety').hidden=true;unlock();return}$('feedback').className='feedback bad';$('feedback').innerHTML='<strong>Проверьте результат по подсказкам.</strong><ul>'+failed.map(f=>'<li>'+esc(f.validation.message)+'</li>').join('')+'</ul><p><strong>Подсказка:</strong> '+esc(failed[0].validation.hint)+'</p>';$('safety').hidden=false;if(attempts>=2)showReference('Показываем пример решения. Сравните свой результат по пунктам.');reportHeight()};
    $('safety').onclick=()=>showReference('Сравните свой результат с примером решения и отметьте выполненные пункты.');function updateConfirm(){$('confirmReference').disabled=![...document.querySelectorAll('.comparison')].every(x=>x.checked)}document.querySelectorAll('.comparison').forEach(x=>x.onchange=updateConfirm);$('confirmReference').onclick=unlock;
    $('reset').onclick=()=>{$('activity').reset();attempts=0;$('feedback').className='';$('feedback').innerHTML='';$('safety').hidden=true;$('reference').hidden=true;$('unlock').hidden=true;document.querySelectorAll('.comparison').forEach(x=>x.checked=false);$('confirmReference').disabled=true;if($('routeText'))$('routeText').hidden=true;reportHeight()};$('continue').onclick=()=>{$('continue').disabled=true;$('continue').textContent='Можно переходить дальше';parent.postMessage({type:'course-interactive-complete',id:r.id},'*')};
async function copyText(text){try{if(!navigator.clipboard)throw new Error();await navigator.clipboard.writeText(text);return true}catch(_e){const t=document.createElement('textarea');t.value=text;t.readOnly=true;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_x){}t.remove();return ok}}
document.querySelectorAll('.course-prompt-copy').forEach(button=>button.onclick=async()=>{const item=prompts.find(x=>x.key===button.dataset.promptKey),status=button.nextElementSibling;const ok=item&&await copyText(item.text);status.textContent=ok?'Скопировано':'Выделите текст и скопируйте вручную';setTimeout(()=>status.textContent='',2500)});new ResizeObserver(reportHeight).observe(document.body);addEventListener('load',reportHeight);
