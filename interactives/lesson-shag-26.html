</main><script id="activity-data" type="application/json">{"record":{"id":"lesson-shag-26","title":"Шаг 26. Как не устареть: инструменты, лимиты, стоимость","file":"lesson-shag-26.html","exact_location":"#livechat; ids digest, limits, scenarioGrid, checklist, toolcheckList","current_behavior":"дайджест и чек-лист выбора инструмента сравнивают переносимый навык и текущие ограничения","proposed_change":"фиксировать критерии выбора, дату проверки и запасной маршрут","checker_class":"структура+факты","required_checks":["оценены доступ, данные, лимит, стоимость и качество","отделено переносимое умение от кнопок сервиса","указана дата/источник проверки тарифа","есть резервный инструмент"],"hint1":"Заполните 5 пунктов toolcheck и добавьте дату, потому что лимиты меняются.","attempt2_behavior":"показать отсутствующий критерий или дату источника","reference_solution":"блоки с идентификаторами checklist, toolcheckList и digest из lesson-shag-26.html","unlock_rule":"5 критериев, дата и резервный маршрут подтверждены","false_negative_safety":"кнопка после первой ошибки → эталон → подтверждение сравнения","external_service_failure_route":"перейти к локальной сравнительной таблице без внешних сервисов","remove_result_download":"да — удалить кнопку экспорта результата задания и код создания .txt; архив материалов сохранить","rationale":"решение не устаревает вместе с интерфейсом","limitations":"цены и лимиты не проверяются онлайн"},"prototype":{"id":"lesson-shag-26","title":"Проверка выбора рабочего инструмента","learner_instruction":"Оцените основной чат-бот по критериям урока, зафиксируйте, где и когда проверяли актуальные условия, и укажите резервный маршрут.","source_note":"Используйте чек-лист выбора инструмента, правило о лимите бесплатной версии и раздел о переносимости из шага 26.","fields":[{"id":"direct_access","type":"checkbox","label":"Инструмент доступен для ежедневной работы без обхода блокировок","help":"Сверьте этот пункт с условиями вашей рабочей среды.","placeholder":"","options":[],"validation":{"mode":"checked","value":true,"values":[],"min":0,"max":0,"message":"Подтвердите доступность инструмента для ежедневной работы.","hint":"В чек-листе урока этот критерий сформулирован как работа в РФ без VPN."}},{"id":"file_input","type":"checkbox","label":"Инструмент принимает нужные для моей задачи файлы","help":"Для работы со сметами, КП и актами важна загрузка документов, а не только текстовый чат.","placeholder":"","options":[],"validation":{"mode":"checked","value":true,"values":[],"min":0,"max":0,"message":"Подтвердите возможность работы с нужными файлами.","hint":"Проверьте допустимые типы и размер загрузки в актуальной справке сервиса."}},{"id":"data_policy","type":"checkbox","label":"Мне понятна политика данных для загружаемых документов","help":"Проверьте, что происходит с документами после загрузки и условия их использования сервисом.","placeholder":"","options":[],"validation":{"mode":"checked","value":true,"values":[],"min":0,"max":0,"message":"Подтвердите, что политика данных проверена.","hint":"Этот критерий особенно важен для рабочих документов."}},{"id":"limits_cost","type":"checkbox","label":"Я проверил(а) актуальные лимиты и сопоставил(а) цену с объёмом задач","help":"Решение о платной версии принимают после реального упора в бесплатный лимит, а не заранее.","placeholder":"","options":[],"validation":{"mode":"checked","value":true,"values":[],"min":0,"max":0,"message":"Подтвердите проверку лимитов и стоимости.","hint":"Цифры лимитов и тарифов нужно смотреть на актуальной странице инструмента."}},{"id":"output_quality","type":"checkbox","label":"Инструмент выдаёт нужный мне формат и приемлемое качество результата","help":"Проверьте это на своей обычной рабочей задаче.","placeholder":"","options":[],"validation":{"mode":"checked","value":true,"values":[],"min":0,"max":0,"message":"Подтвердите проверку формата и качества результата.","hint":"Учитывайте, можно ли забрать из чата текст или таблицу без ручного копирования по частям."}},{"id":"review_record","type":"textarea","label":"Источник и дата проверки; резервный маршрут","help":"Запишите, на какой странице сервиса вы сверили условия и когда, затем укажите альтернативный инструмент или другой локальный путь работы.","placeholder":"Источник: …; дата проверки: …; резервный маршрут: …","options":[],"validation":{"mode":"min_length","value":null,"values":[],"min":20,"max":0,"message":"Укажите источник, дату проверки и резервный маршрут.","hint":"Лимиты меняются, поэтому решение должно иметь дату и запасной вариант."}}],"reference":{"title":"Что сверить с примером решения","lead":"Выбор инструмента опирается на проверяемые условия, а не на привычные кнопки конкретного сервиса.","items":["Проверена доступность для ежедневной работы без обхода блокировок.","Проверена работа с нужными файлами и понятна политика данных для загружаемых документов.","Актуальные лимиты и стоимость сверены по источнику с указанной датой проверки.","Нужный формат и качество результата проверены на рабочей задаче; при необходимости можно забрать текст или таблицу из чата.","Есть резервный маршрут на случай недоступности сервиса.","Переносимыми остаются структура промпта «роль → контекст → задача → формат» и библиотека промптов, а не интерфейс сервиса."]},"comparison_confirmations":["Я оценил(а) доступ, работу с файлами, политику данных, лимиты и стоимость.","Я проверил(а) нужный формат и качество ответа на своей задаче.","Я указал(а) источник и дату проверки актуальных условий.","Я предусмотрел(а) резервный маршрут при недоступности основного инструмента.","Я отделил(а) переносимый навык формулирования задачи от кнопок конкретного сервиса."],"success_message":"Критерии выбора, дата проверки и резервный маршрут зафиксированы. Теперь решение можно пересмотреть при изменении лимитов или интерфейса.","external_failure":{"available":true,"label":"Не получилось выполнить задание в используемом сервисе","instruction":"Заполните локальную сравнительную таблицу по пяти критериям урока для основного и резервного инструмента, а актуальные условия отметьте как требующие последующей проверки на странице сервиса."},"design_rationale":"Пять флажков переводят чек-лист урока в достижимую локальную самопроверку, а отдельная структурированная запись требует дату, источник и резервный путь без попытки автоматически оценивать свободный текст."},"prompts":[]}</script><script>
const payload=JSON.parse(document.getElementById('activity-data').textContent),r=payload.record,p=payload.prototype,prompts=payload.prompts,$=id=>document.getElementById(id);let attempts=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('activityTitle').textContent=p.title;$('instruction').textContent=p.learner_instruction;$('sourceNote').textContent=p.source_note;$('referenceLead').textContent=p.reference.lead;$('referenceItems').innerHTML=p.reference.items.map(x=>'<li>'+esc(x)+'</li>').join('');$('success').textContent=p.success_message;
function fieldHtml(f){const help=f.help?'<div class="help">'+esc(f.help)+'</div>':'';let control='';if(f.type==='textarea')control='<textarea id="'+esc(f.id)+'" placeholder="'+esc(f.placeholder)+'"></textarea>';else if(f.type==='select')control='<select id="'+esc(f.id)+'"><option value="">'+esc(f.placeholder||'Выберите вариант')+'</option>'+f.options.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select>';else if(f.type==='radio')control=f.options.map((x,i)=>'<div class="option"><input type="radio" id="'+esc(f.id)+'_'+i+'" name="'+esc(f.id)+'" value="'+esc(x)+'"><label for="'+esc(f.id)+'_'+i+'">'+esc(x)+'</label></div>').join('');else if(f.type==='checkbox')control='<div class="option"><input type="checkbox" id="'+esc(f.id)+'"><label for="'+esc(f.id)+'">'+esc(f.label)+'</label></div>';else control='<input id="'+esc(f.id)+'" type="'+f.type+'" placeholder="'+esc(f.placeholder)+'">';const heading=f.type==='checkbox'?'':'<label for="'+esc(f.id)+'">'+esc(f.label)+'</label>';return '<div class="field">'+heading+help+control+'</div>'}
$('fields').innerHTML=p.fields.map(fieldHtml).join('');if(p.external_failure?.available){$('route').innerHTML='<label><input id="externalFailure" type="checkbox"> '+esc(p.external_failure.label)+'</label><div id="routeText" class="route-text" hidden>'+esc(p.external_failure.instruction)+'</div>';$('externalFailure').onchange=e=>$('routeText').hidden=!e.target.checked}else $('route').hidden=true;
$('confirmations').innerHTML=p.comparison_confirmations.map((x,i)=>'<div class="confirm"><label><input type="checkbox" class="comparison" id="cmp_'+i+'"> '+esc(x)+'</label></div>').join('');
function norm(v){return String(v??'').toLowerCase().replaceAll('ё','е').replace(/\s+/g,' ').trim()}function value(f){if(f.type==='radio')return document.querySelector('input[name="'+CSS.escape(f.id)+'"]:checked')?.value||'';if(f.type==='checkbox')return $(f.id).checked;return $(f.id).value}
function valid(f){const v=value(f),rule=f.validation,mode=rule.mode;if(mode==='required')return f.type==='checkbox'?v:Boolean(norm(v));if(mode==='min_length')return norm(v).length>=Number(rule.min||1);if(mode==='equals')return norm(v)===norm(rule.value);if(mode==='one_of')return (rule.values||[]).some(x=>norm(v)===norm(x));if(mode==='contains_any')return (rule.values||[]).some(x=>norm(v).includes(norm(x)));if(mode==='contains_all')return (rule.values||[]).every(x=>norm(v).includes(norm(x)));if(mode==='checked')return v===true;if(mode==='number_range'){const n=Number(v);return Number.isFinite(n)&&n>=Number(rule.min)&&n<=Number(rule.max)}return false}
    function reportHeight(){parent.postMessage({type:'course-interactive-height',id:r.id,height:document.documentElement.scrollHeight},'*')}function unlock(){$('unlock').hidden=false;parent.postMessage({type:'course-interactive-complete',id:r.id},'*');$('unlock').scrollIntoView({behavior:'smooth',block:'start'});reportHeight()}
    function showReference(reason){$('reference').hidden=false;if(reason){$('feedback').className='feedback bad';$('feedback').innerHTML='<strong>'+esc(reason)+'</strong>'}$('reference').scrollIntoView({behavior:'smooth',block:'start'});reportHeight()}
    $('activity').onsubmit=e=>{e.preventDefault();attempts++;const failed=p.fields.filter(f=>!valid(f));if(!failed.length){$('feedback').className='feedback ok';$('feedback').innerHTML='<strong>Всё верно.</strong><p>Все обязательные пункты отмечены.</p>';$('safety').hidden=true;unlock();return}$('feedback').className='feedback bad';$('feedback').innerHTML='<strong>Проверьте результат по подсказкам.</strong><ul>'+failed.map(f=>'<li>'+esc(f.validation.message)+'</li>').join('')+'</ul><p><strong>Подсказка:</strong> '+esc(failed[0].validation.hint)+'</p>';$('safety').hidden=false;if(attempts>=2)showReference('Показываем пример решения. Сравните свой результат по пунктам.');reportHeight()};
    $('safety').onclick=()=>showReference('Сравните свой результат с примером решения и отметьте выполненные пункты.');function updateConfirm(){$('confirmReference').disabled=![...document.querySelectorAll('.comparison')].every(x=>x.checked)}document.querySelectorAll('.comparison').forEach(x=>x.onchange=updateConfirm);$('confirmReference').onclick=unlock;
    $('reset').onclick=()=>{$('activity').reset();attempts=0;$('feedback').className='';$('feedback').innerHTML='';$('safety').hidden=true;$('reference').hidden=true;$('unlock').hidden=true;document.querySelectorAll('.comparison').forEach(x=>x.checked=false);$('confirmReference').disabled=true;if($('routeText'))$('routeText').hidden=true;reportHeight()};$('continue').onclick=()=>{$('continue').disabled=true;$('continue').textContent='Можно переходить дальше';parent.postMessage({type:'course-interactive-complete',id:r.id},'*')};
async function copyText(text){try{if(!navigator.clipboard)throw new Error();await navigator.clipboard.writeText(text);return true}catch(_e){const t=document.createElement('textarea');t.value=text;t.readOnly=true;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_x){}t.remove();return ok}}
document.querySelectorAll('.course-prompt-copy').forEach(button=>button.onclick=async()=>{const item=prompts.find(x=>x.key===button.dataset.promptKey),status=button.nextElementSibling;const ok=item&&await copyText(item.text);status.textContent=ok?'Скопировано':'Выделите текст и скопируйте вручную';setTimeout(()=>status.textContent='',2500)});new ResizeObserver(reportHeight).observe(document.body);addEventListener('load',reportHeight);
</script></body></html>
