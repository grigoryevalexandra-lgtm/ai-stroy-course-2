":0,"max":0,"message":"Подтвердите обязательную проверку человеком.","hint":"Уверенный тон ИИ не гарантирует точность."}}],"reference":{"title":"Что сверить с примером решения","lead":"В хорошем разборе ответ привязан к документу и пункту, а разница между двумя режимами объяснена проверяемой конкретикой.","items":["Источник назван: предписание № 57, письмо техзаказчика № 311 от 24.06.2026 или договор подряда ООО «СтройМонолит».","Есть ссылка на конкретный пункт или раздел документа.","Разделены общий ответ без документов и ответ по приложенному файлу.","Отмечено, что документ добавляет конкретные требования, сроки, цифры или цитаты.","Критичные цифры и ссылки проверяются по первоисточнику человеком."]},"comparison_confirmations":["Я сравнил(а) один и тот же вопрос без документа и с документом.","Я указал(а) источник и конкретный пункт, по которому можно проверить ответ.","Я понимаю, что уверенный ответ без источника может быть бесполезным или ошибочным.","Я оставлю финальную проверку юридически значимого текста человеку."],"success_message":"Готово: вы связали ответ с документом и проверяемым пунктом, объяснили эффект контекста и подтвердили человеческую проверку. Можно переходить дальше.","external_failure":{"available":true,"label":"Не получилось выполнить задание в используемом сервисе","instruction":"Переключите тренажёр на встроенный пример и используйте локальные тексты предписания № 57, письма № 311 и договора из материалов урока; сравните показанные ответы и заполните поля без внешнего чата."},"design_rationale":"Источник и пункт выбираются из фактов урока, поэтому проверка детерминирована. Свободное сравнение проверяется только на минимальную содержательность, а не на случайные ключевые слова; отдельный флажок фиксирует обязательную проверку человеком. Все материалы доступны локально, сервер и экспорт результата не нужны."},"prompts":[]}</script><script>
const payload=JSON.parse(document.getElementById('activity-data').textContent),r=payload.record,p=payload.prototype,prompts=payload.prompts,$=id=>document.getElementById(id);let attempts=0;

function fieldHtml(f){const help=f.help?'<div class="help">'+esc(f.help)+'</div>':'';let control='';if(f.type==='textarea')control='<textarea id="'+esc(f.id)+'" placeholder="'+esc(f.placeholder)+'"></textarea>';else if(f.type==='select')control='<select id="'+esc(f.id)+'"><option value="">'+esc(f.placeholder||'Выберите вариант')+'</option>'+f.options.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select>';else if(f.type==='radio')control=f.options.map((x,i)=>'<div class="option"><input type="radio" id="'+esc(f.id)+'_'+i+'" name="'+esc(f.id)+'" value="'+esc(x)+'"><label for="'+esc(f.id)+'_'+i+'">'+esc(x)+'</label></div>').join('');else if(f.type==='checkbox')control='<div class="option"><input type="checkbox" id="'+esc(f.id)+'"><label for="'+esc(f.id)+'">'+esc(f.label)+'</label></div>';else control='<input id="'+esc(f.id)+'" type="'+f.type+'" placeholder="'+esc(f.placeholder)+'">';const heading=f.type==='checkbox'?'':'<label for="'+esc(f.id)+'">'+esc(f.label)+'</label>';return '<div class="field">'+heading+help+control+'</div>'}

function norm(v){return String(v??'').toLowerCase().replaceAll('ё','е').replace(/\s+/g,' ').trim()}function value(f){if(f.type==='radio')return document.querySelector('input[name="'+CSS.escape(f.id)+'"]:checked')?.value||'';if(f.type==='checkbox')return $(f.id).checked;return $(f.id).value}
function valid(f){const v=value(f),rule=f.validation,mode=rule.mode;if(mode==='required')return f.type==='checkbox'?v:Boolean(norm(v));if(mode==='min_length')return norm(v).length>=Number(rule.min||1);if(mode==='equals')return norm(v)===norm(rule.value);if(mode==='one_of')return (rule.values||[]).some(x=>norm(v)===norm(x));if(mode==='contains_any')return (rule.values||[]).some(x=>norm(v).includes(norm(x)));if(mode==='contains_all')return (rule.values||[]).every(x=>norm(v).includes(norm(x)));if(mode==='checked')return v===true;if(mode==='number_range'){const n=Number(v);return Number.isFinite(n)&&n>=Number(rule.min)&&n<=Number(rule.max)}return false}
    function reportHeight(){parent.postMessage({type:'course-interactive-height',id:r.id,height:document.documentElement.scrollHeight},'*')}function unlock(){$('unlock').hidden=false;parent.postMessage({type:'course-interactive-complete',id:r.id},'*');$('unlock').scrollIntoView({behavior:'smooth',block:'start'});reportHeight()}

async function copyText(text){try{if(!navigator.clipboard)throw new Error();await navigator.clipboard.writeText(text);return true}catch(_e){const t=document.createElement('textarea');t.value=text;t.readOnly=true;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_x){}t.remove();return ok}}
document.querySelectorAll('.course-prompt-copy').forEach(button=>button.onclick=async()=>{const item=prompts.find(x=>x.key===button.dataset.promptKey),status=button.nextElementSibling;const ok=item&&await copyText(item.text);status.textContent=ok?'Скопировано':'Выделите текст и скопируйте вручную';setTimeout(()=>status.textContent='',2500)});new ResizeObserver(reportHeight).observe(document.body);addEventListener('load',reportHeight);
